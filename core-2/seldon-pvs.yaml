apiVersion: v1
kind: PersistentVolume
metadata:
  name: scheduler-state-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /var/lib/seldon/scheduler-state
    type: DirectoryOrCreate
  claimRef:
    namespace: seldon-mesh
    name: scheduler-state-seldon-scheduler-0
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - w1
---
